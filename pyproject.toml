[tool.poetry]
name = "supply-chain-orchestrator"
version = "0.1.0"
description = "Agentic Supply-Chain Resilience Orchestrator"
authors = ["Supply Chain Team"]
readme = "README.md"
packages = [{include = "orchestrator", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.30"}

# Config + validation
pydantic = "^2.7"
pydantic-settings = "^2.3"

# Simulation
numpy = "^1.26"

# HTTP (also the transport for every LLM provider - no per-vendor SDK)
httpx = "^0.27"

[tool.poetry.group.db]
optional = true

[tool.poetry.group.db.dependencies]
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29"
pgvector = "^0.3"
alembic = "^1.13"

[tool.poetry.group.agents]
optional = true

[tool.poetry.group.agents.dependencies]
langgraph = "^0.2"

[tool.poetry.group.ingestion]
optional = true

[tool.poetry.group.ingestion.dependencies]
feedparser = "^6.0"
apscheduler = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
ruff = "^0.4"
# PuLP is a test oracle only: the runtime allocator is pure numpy.
pulp = "^2.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
